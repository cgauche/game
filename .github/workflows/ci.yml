name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # src/data/*.json sont la SOURCE app-owned (commitée) — plus de régénération build:data.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
