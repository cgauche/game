name: CI

on:
  push:
    branches: ['chantier/1801-diag']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - id: install
        run: npm ci
      - run: node --version; git --version; nproc; free -g; locale; echo "HOME=$HOME TMPDIR=$TMPDIR RUNNER_TEMP=$RUNNER_TEMP"
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/docs/build-all.mjs --check --tout --quiet
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git status --porcelain
