name: Export des issues

on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run issues:export
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit et push si diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/decisions
          git diff --staged --quiet || (git commit -m "chore(decisions): export hebdomadaire des issues" && git push)
