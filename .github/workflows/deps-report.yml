name: Rapport de dépendances

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --prefix server ci
      - name: Ouvrir l'issue de rapport mensuel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run deps:report
