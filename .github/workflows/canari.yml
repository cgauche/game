name: Canari

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run agents:check
      - run: npm run test:agents
      - run: npm run test:hooks
      - run: npm run test:docs
      - run: npm run test:recette
      - name: Idempotence des adaptateurs agents
        run: |
          set -e
          npm run agents:sync
          git diff --exit-code -- AGENTS.md .agents/skills .codex/credo.md
      - name: Audit sécurité (échoue sur high/critical)
        run: npm audit --audit-level=high
      # src/data/*.json sont la SOURCE app-owned (commitée) — plus de régénération build:data.
      - name: Dérive des registres générés
        # Glob sur TOUS les fichiers générés, pas les seuls `_registry` : `_ids.generated.ts`,
        # `_registry-scenes.generated.ts` et `qualityId.generated.ts` en tombaient dehors, si bien
        # qu'une recette ajoutée sans `npm run gen` périmait le registre en silence (#1680).
        run: npm run gen && git diff --exit-code -- '*.generated.ts'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run docs:check
      # Le seul volet des plans datés qui exige le réseau : un `Ticket:` dont TOUTES les issues sont
      # fermées = plan exécuté que la politique `docs/` veut SUPPRIMÉ. `gh issue list --limit N` impose
      # un plafond numérique à re-relever quand le stock grossit (849 ouvertes pour un `--limit 1000`) :
      # on passe par la pagination réelle de l'API REST, même forme que scripts/ops/export-issues.mjs.
      # L'API `issues` renvoie aussi les pull requests — sans importance ici : la garde ne fait que
      # tester l'APPARTENANCE d'un numéro d'issue à l'ensemble des ouvertes.
      - name: Plans datés — ancre Ticket encore OUVERTE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh api --paginate --jq '.[] | {number}' 'repos/{owner}/{repo}/issues?state=open&per_page=100' \
            | jq -s '.' > /tmp/issues-ouvertes.json
          node scripts/docs/check-plans-anchors.mjs --online /tmp/issues-ouvertes.json
      - name: Fraîcheur des catalogues Atlas RAW
        run: npm run raw:catalogs && git diff --exit-code -- 'docs/raw/catalogue-*.md'
      - run: npm run raw:coverage
      - run: npm run raw:reconcile
      - run: npm run test:raw
      - run: npm run raw:check-refs
      - run: npm run raw:check-code-refs
      - run: npm run raw:reanchor
      - run: npm --prefix server ci
      - name: Audit sécurité server (échoue sur high/critical)
        run: npm --prefix server audit --audit-level=high
      - run: npm --prefix server run typecheck
      - name: Ouvrir une issue si le canari est rouge
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Canari rouge — environnement ou suite cassés" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label canari \
          || gh issue create \
            --title "Canari rouge — environnement ou suite cassés" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
